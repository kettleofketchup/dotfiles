theme = "github-dark-default"
mode = "auto"
line_numbers = true
wrap_lines = false
hunk_headers = true
menu_bar = true
agent_notes = true
copy_decorations = false
cursor_line = "row"

# hunk-goodies: viewed marks (V) that sync to GitHub, plus a local fix that keeps the
# cursor in place after marking. Vendored at ~/.config/hunk/hunk-goodies; see its index.tsx.
[extensions]
paths = ["~/.config/hunk/hunk-goodies"]
